[project]
name = "backend"
description = "Backend for the management site of the arcade cabinet"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "David Maat", email = "r1036789@student.thomasmore.be" },
    { name = "Stijn Rombouts", email = "r1036855@student.thomasmore.be" }
]
dynamic = ["version"]
dependencies = [
    "fastapi[standard]",
    "docker",
    "puremagic",
    "s3fs",
    "sqlalchemy",
    "psycopg2-binary",
    "httpx",
    "python-dotenv",
    "PyGithub",
]
[project.optional-dependencies]
dev = [
    "pytest",
]
lint-test = [
    "flake8",
    "flake8-bugbear",
    "flake8-builtins",
    "flake8-noqa",
    "flake8-pylint",
    "flake8-unused-arguments",
    "pep8",
    "pep8-naming",
    "pyright",
    "pipdeptree",
    "entrypoints",
    "mccabe",
    "pycodestyle",
    "pyflakes",
    "flake8-mutable",
    "flake8-quotes",
    "flake8-pep3101",
    "flake8-comprehensions",
    "flake8-debugger",
    "flake8-pep585",
    "mypy",
    "mypy-extensions",
    "typing-extensions",
    "types-pytz",
    "types-requests",
    "types-paramiko",
    "pathspec",
    "librt",
    "pytest",
    "attrs",
    "iniconfig",
    "packaging",
    "pyparsing",
    "pluggy",
    "pygments",
    "pytest-django",
    "pytest-cov",
    "coverage",
    "pytest-socket",
    "pytest-factoryboy==2.5.0",
    "factory-boy==3.2.1",
    "Faker==15.3.2",
    "python-dateutil==2.8.2",
    "text_unidecode==1.3",
    "inflection==0.5.1",
    "requests_mock",
]
[tool.setuptools.packages.find]
where = ["src"]