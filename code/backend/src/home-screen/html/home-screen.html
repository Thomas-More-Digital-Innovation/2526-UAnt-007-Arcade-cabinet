<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Cabinet</title>
    <!-- CSS and JS will be linked here relative to the dist root -->
    <link rel="stylesheet" href="css/home-screen.css">
</head>
<body id="homeScreen">
    <h1 id="projectTitle">Arcade Selection</h1>
    <div class="menu">
        <!-- Games will be injected by JS -->
    </div>

    <!-- Start screen / Description overlay -->
    <div id="descriptionOverlay" class="overlay hidden">
        <div class="overlay-content">
            <h2 id="overlayGameTitle">Game Title</h2>
            <div id="overlayGameDescription" class="description-text">
                Game story and explanation go here...
            </div>
            <div class="overlay-footer">
                Press START to Play
            </div>
        </div>
    </div>

    <!-- Data injected by the build script -->
    <script id="game-data" type="application/json">
        {{GAMES_JSON}}
    </script>
    <script src="js/HomeScreen.js"></script>
</body>
</html>
